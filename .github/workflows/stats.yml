name: Profile stats

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate stats cards
        run: node .github/scripts/stats.mjs
        env:
          # Fine-grained PAT of the profile owner: all repositories, Metadata read-only.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: Commit if the cards changed
        run: |
          git add assets/stats-*.svg
          if git diff --cached --quiet; then
            echo "Stats unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile stats"
          git push
